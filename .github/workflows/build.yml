# Runs the tests, then builds the Windows .exe (and a Mac .app for previewing).
# Download the results from the Actions tab -> latest run -> Artifacts.

name: Test and build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest -q
    - name: Build executable
      run: pyinstaller hospital_stock_app.spec --clean --noconfirm
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: HospitalStockApp-Windows
        path: dist/HospitalStockApp.exe
        retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Build app
      run: pyinstaller hospital_stock_app.spec --clean --noconfirm
    - name: Zip Mac app
      run: cd dist && ditto -c -k --keepParent HospitalStockApp.app HospitalStockApp-Mac.zip
    - name: Upload Mac app
      uses: actions/upload-artifact@v4
      with:
        name: HospitalStockApp-Mac
        path: dist/HospitalStockApp-Mac.zip
        retention-days: 30
